name: Published command smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published-command:
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '5.5.6'
            official: 'https://download.codebuddy.cn/workbuddy/saas/win32-x64-user/WorkBuddy-win32-x64-user-5.5.6.38337834-5f969292.exe'
          - version: '5.9.3'
            official: 'https://acc-1258344699.cos.ap-guangzhou.myqcloud.com/workbuddy/saas/win32-x64-user/WorkBuddy-win32-x64-user-5.9.3.42398134-d4692421.exe'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      DISABLE_TELEMETRY: '1'
      DISABLE_GALILEO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download and inspect official Windows WorkBuddy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = '${{ matrix.official }}'
          $exe = Join-Path $env:RUNNER_TEMP 'WorkBuddy-official.exe'
          curl.exe --fail --location --retry 2 --max-time 300 --output $exe $uri
          if ($LASTEXITCODE -ne 0) { throw 'Official download failed' }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          Write-Host "Official package signature=$($signature.Status) signer=$($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid') { throw 'Invalid official package signature' }
          $unpack = Join-Path $env:RUNNER_TEMP 'official-workbuddy'
          & 'C:\Program Files\7-Zip\7z.exe' x $exe "-o$unpack" -y -bso0
          if ($LASTEXITCODE -ne 0) { throw 'Official installer cannot be extracted with 7-Zip; no installer was executed' }
          $nestedArchives = @(Get-ChildItem -LiteralPath $unpack -Filter '*.7z' -Recurse -File)
          foreach ($nested in $nestedArchives) {
            & 'C:\Program Files\7-Zip\7z.exe' x $nested.FullName "-o$unpack\payload" -y -bso0
            if ($LASTEXITCODE -ne 0) { throw 'Nested official payload extraction failed' }
          }
          $candidates = @(Get-ChildItem -LiteralPath $unpack -Filter codebuddy -Recurse -File | Where-Object { $_.FullName -match '[\\/]cli[\\/]bin[\\/]codebuddy$' })
          if ($candidates.Count -ne 1) {
            Get-ChildItem -LiteralPath $unpack -Recurse -File | Select-Object -First 60 -ExpandProperty FullName
            throw "Expected one bundled real CLI, found $($candidates.Count)"
          }
          $cliRoot = Split-Path (Split-Path $candidates[0].FullName)
          $targetParent = Join-Path $env:LOCALAPPDATA 'Programs\WorkBuddy\resources\app.asar.unpacked'
          New-Item -ItemType Directory -Force -Path $targetParent | Out-Null
          Copy-Item -LiteralPath $cliRoot -Destination (Join-Path $targetParent 'cli') -Recurse
          $cli = Join-Path $targetParent 'cli\bin\codebuddy'
          node $cli --version
          if ($LASTEXITCODE -ne 0) { throw 'Actual bundled CLI cannot run' }
          # Empty disposable configuration: no login, credentials or model requests.
          $config = Join-Path $env:USERPROFILE '.workbuddy'
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          '{"theme":"smoke-test-sentinel"}' | Set-Content -LiteralPath (Join-Path $config 'settings.json') -Encoding UTF8
      - name: Fetch public chat link and run its exact independent Windows launcher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://gitee.com/JachinLan/jjaitech-memory/raw/main/INSTALL-WORKBUDDY.md'
          $doc = (Invoke-WebRequest -UseBasicParsing $url).Content
          $cmd = @'
          Start-Process powershell.exe -ArgumentList '-NoLogo -NoProfile -NoExit -Command "irm https://gitee.com/JachinLan/jjaitech-memory/raw/main/install.ps1 | iex"'
          '@
          if (-not $doc.Contains($cmd)) { throw 'Public chat link does not contain the reviewed launch command' }
          $answer = Join-Path $env:RUNNER_TEMP 'employee-answer.txt'
          [IO.File]::WriteAllText($answer, "YES`r`nexit`r`n", [Text.Encoding]::ASCII)
          $log = Join-Path $env:RUNNER_TEMP 'external-install.log'
          $err = Join-Path $env:RUNNER_TEMP 'external-install.err'
          $PSDefaultParameterValues = @{'Start-Process:RedirectStandardInput'=$answer;'Start-Process:RedirectStandardOutput'=$log;'Start-Process:RedirectStandardError'=$err;'Start-Process:PassThru'=$true}
          $child = & ([scriptblock]::Create($cmd))
          if (-not $child.WaitForExit(150000)) { throw 'Independent installer did not finish' }
          Get-Content $log -Tail 20
          if (Test-Path $err) { Get-Content $err -Tail 15 }
          python -X utf8 .github/tests/verify_install.py
          if ($LASTEXITCODE -ne 0) { throw 'Chat launcher did not produce a verified installation' }
      - name: Repeat exact Gitee PowerShell command and verify registration and local behavior
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          function global:Read-Host { param([string]$Prompt); if ($Prompt -eq 'Type YES to continue') { return 'YES' }; throw "Unexpected prompt: $Prompt" }
          irm https://gitee.com/JachinLan/jjaitech-memory/raw/main/install.ps1 | iex
          python -X utf8 .github/tests/verify_install.py
          if ($LASTEXITCODE -ne 0) { throw 'Repeat install verification failed' }
      - name: Download the exact mainland employee ZIP and verify release files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          $zip = Join-Path $env:RUNNER_TEMP 'employee-code.zip'
          Invoke-WebRequest -UseBasicParsing 'https://gitee.com/JachinLan/jjaitech-memory/raw/main/windows/jjaitech-memory-Windows.zip' -OutFile $zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '0d21a8d2c12d5d986064ae5d95a46bedefae653d3bdd6179f8470f4e11d30da0') { throw 'Anonymous Gitee payload does not match tested ZIP' }
          $dir = Join-Path $env:RUNNER_TEMP 'employee offline kit'
          Expand-Archive $zip -DestinationPath $dir
          $repo = Join-Path $dir 'jjaitech-memory-main'
          foreach ($file in $release.source_files.PSObject.Properties) {
            if ((Get-FileHash (Join-Path "$repo/jjaitech-memory" $file.Name) -Algorithm SHA256).Hash -ne $file.Value) { throw "Wrong file in employee download: $($file.Name)" }
          }
          if ((Get-FileHash (Join-Path $repo 'Install-Windows.cmd')).Hash -ne (Get-FileHash 'Install-Windows.cmd').Hash) { throw 'Wrong entrypoint' }
      - name: Fresh local CMD install with network blocked for installer runtimes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Join-Path $env:USERPROFILE '.workbuddy'
          Move-Item $cfg (Join-Path $env:RUNNER_TEMP 'online-test-config')
          $wiki = Join-Path $env:USERPROFILE 'AI-Wiki'
          if (Test-Path $wiki) { Move-Item $wiki (Join-Path $env:RUNNER_TEMP 'online-test-wiki') }
          New-Item $cfg -ItemType Directory | Out-Null
          '{"theme":"smoke-test-sentinel"}' | Set-Content (Join-Path $cfg 'settings.json') -Encoding UTF8
          $rules = 'jjaitech-smoke-' + [guid]::NewGuid().ToString('N')
          $env:JJ_OFFLINE_CMD = Join-Path $env:RUNNER_TEMP 'employee offline kit\jjaitech-memory-main\Install-Windows.cmd'
          try {
            $runtimes = @((Get-Command powershell.exe).Source, (Get-Command node.exe).Source, (Get-Command python.exe).Source)
            $runtimes += @(Get-Command git.exe,winget.exe,curl.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)
            $runtimes += @(Join-Path $env:ProgramFiles 'Git\bin\bash.exe'; Join-Path $env:ProgramFiles 'Git\usr\bin\bash.exe')
            foreach ($exe in ($runtimes | Select-Object -Unique)) {
              if (Test-Path -LiteralPath $exe) { New-NetFirewallRule -DisplayName $rules -Direction Outbound -Action Block -Program $exe -Profile Any | Out-Null }
            }
            $env:HTTPS_PROXY = 'http://127.0.0.1:1'
            $env:HTTP_PROXY = $env:HTTPS_PROXY
            $env:ALL_PROXY = $env:HTTPS_PROXY
            python -c "import os,subprocess; p=subprocess.run([os.environ['ComSpec'],'/d','/c',os.path.basename(os.environ['JJ_OFFLINE_CMD'])],cwd=os.path.dirname(os.environ['JJ_OFFLINE_CMD']),input=b'YES\r\n\r\n',timeout=140); raise SystemExit(p.returncode)"
            if ($LASTEXITCODE -ne 0) { throw 'Local Windows CMD failed' }
            python -X utf8 .github/tests/verify_install.py
            if ($LASTEXITCODE -ne 0) { throw 'Local CMD verification failed' }
          } finally {
            Get-NetFirewallRule -DisplayName $rules -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          }
